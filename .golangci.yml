version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]

  exclusions:
    rules:
      # Tests deliberately use weak permissions, fixed passwords and error
      # paths that the security and style linters flag.
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
