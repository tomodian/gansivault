name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    # go 1.27 is the floor, set by the go directive in go.mod. Pinning the
    # toolchain to the installed one stops Go from silently fetching a newer
    # release, which would make the lower matrix entry meaningless. Add the
    # next release here as a second entry once it ships, so the matrix covers
    # floor and latest again.
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race ./...

  coverage:
    name: coverage must be 100%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce the coverage gate
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          if [ "$total" != "100.0%" ]; then
            echo "::error::coverage is $total, this project requires 100.0%"
            echo "Statements that are not covered:"
            go tool cover -func=coverage.out | grep -v '100.0%$' || true
            exit 1
          fi
          echo "coverage is $total"

      - name: Upload the coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  pin:
    name: actions are pinned
    runs-on: ubuntu-latest
    # Every action is pinned to a full commit SHA with the tag kept in a
    # trailing comment, so a moving tag cannot swap the code underneath us.
    # fix and skip_push keep this job read only: it reports and fails rather
    # than pushing a correction. verify also checks that each SHA really is
    # the commit its version comment claims. Run `make pin` to re-pin.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          skip_push: "true"
          verify: "true"

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - run: go mod tidy

      - name: Fail if go.mod or go.sum changed
        run: git diff --exit-code -- go.mod go.sum

  build:
    name: cross compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # CGO is off so the Lambda provided.al2023 runtime needs no extra layers.
      - name: Build the CLI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" ./cmd/gansivault

  interop:
    name: interop with real ansible-vault
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible: ["ansible-core~=2.16.0", "ansible-core~=2.18.0", "ansible-core"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ansible
        run: pip install "${{ matrix.ansible }}"

      - name: Show versions
        run: |
          ansible --version
          ansible-vault --version

      # The interop test skips itself when ansible-vault is absent, so make
      # sure it really ran here.
      - name: Round trip against ansible-vault
        run: go test -v -run TestInteropWithRealAnsibleVault . 2>&1 | tee interop.log

      - name: Fail if the interop test was skipped
        run: |
          if grep -q "SKIP: TestInteropWithRealAnsibleVault" interop.log; then
            echo "::error::the interop test was skipped even though ansible is installed"
            exit 1
          fi
