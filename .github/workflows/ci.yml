name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    # go 1.24 is the floor, set by crypto/pbkdf2 and testing.T.Chdir. Pinning
    # the toolchain to the installed one stops Go from silently fetching a
    # newer release, which would make the lower matrix entry meaningless.
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.24", "1.26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race ./...

  coverage:
    name: coverage must be 100%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce the coverage gate
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          if [ "$total" != "100.0%" ]; then
            echo "::error::coverage is $total, this project requires 100.0%"
            echo "Statements that are not covered:"
            go tool cover -func=coverage.out | grep -v '100.0%$' || true
            exit 1
          fi
          echo "coverage is $total"

      - name: Upload the coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - run: go mod tidy

      - name: Fail if go.mod or go.sum changed
        run: git diff --exit-code -- go.mod go.sum

  build:
    name: cross compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # CGO is off so the Lambda provided.al2023 runtime needs no extra layers.
      - name: Build the CLI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" ./cmd/gansivault

  interop:
    name: interop with real ansible-vault
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible: ["ansible-core~=2.16.0", "ansible-core~=2.18.0", "ansible-core"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ansible
        run: pip install "${{ matrix.ansible }}"

      - name: Show versions
        run: |
          ansible --version
          ansible-vault --version

      # The interop test skips itself when ansible-vault is absent, so make
      # sure it really ran here.
      - name: Round trip against ansible-vault
        run: go test -v -run TestInteropWithRealAnsibleVault . 2>&1 | tee interop.log

      - name: Fail if the interop test was skipped
        run: |
          if grep -q "SKIP: TestInteropWithRealAnsibleVault" interop.log; then
            echo "::error::the interop test was skipped even though ansible is installed"
            exit 1
          fi
